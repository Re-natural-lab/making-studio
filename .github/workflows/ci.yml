name: making-studio-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify canonical boundary
        shell: bash
        run: |
          grep -q "CANONICAL_API_URL" api/making-studio.ts
          if grep -Eq "new Map|SENDGRID_API_KEY|api.sendgrid.com|const queue" api/making-studio.ts; then
            echo "Making Studio API must not own in-memory state or SendGrid delivery"
            exit 1
          fi
      - name: Typecheck and build
        run: npm run build
